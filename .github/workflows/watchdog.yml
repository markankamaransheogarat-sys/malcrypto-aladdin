name: MalCrypto Aladdin 24/7 Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 24/7 Cross-Market Watchdog
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node --import tsx src/watchdog.ts

      - name: Commit updated Knowledge Graph snapshot
        run: |
          git config user.name "malcrypto-watchdog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(watchdog): update bi-temporal graph snapshot [skip ci]"
            git push
          fi
