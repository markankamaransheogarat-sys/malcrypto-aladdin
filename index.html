<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalCrypto Aladdin — Cross-Market Causal Risk Terminal</title>
    <link rel="manifest" href="./manifest.json" />
    <style>
      :root {
        --bg: #111315;
        --panel: #181b1f;
        --border: #2a2f36;
        --text: #e6e8ea;
        --muted: #8b949e;
        --gold: #d8b876;
        --cyan: #5d909b;
        --pos: #8caa6b;
        --neg: #cf6a6a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 13px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: #0d0f11;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--gold);
        font-size: 14px;
      }
      .kpis {
        display: flex;
        gap: 18px;
        font-family: monospace;
        font-size: 12px;
      }
      .nav-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .tabs {
        display: flex;
        gap: 6px;
      }
      .tab-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 6px 12px;
        cursor: pointer;
        font-family: monospace;
        font-weight: 600;
        border-radius: 4px;
      }
      .tab-btn.active {
        background: rgba(216, 184, 118, 0.14);
        border-color: var(--gold);
        color: var(--gold);
      }
      .btn-primary {
        background: var(--gold);
        color: #111;
        border: none;
        padding: 6px 12px;
        font-weight: 700;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-sec {
        background: #23272d;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      main {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .tab-panel {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        padding: 14px 16px;
      }
      .tab-panel.hidden {
        display: none;
      }
      #panel-GRAPH {
        padding: 0;
        display: flex;
      }
      #panel-GRAPH.hidden {
        display: none;
      }
      #graph-canvas {
        flex: 1;
        height: 100%;
        display: block;
      }
      aside.inspector {
        width: 330px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 14px;
        overflow-y: auto;
      }
      .insp-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--gold);
      }
      .insp-sub {
        color: var(--muted);
        font-size: 11px;
        margin: 4px 0 10px;
      }
      .insp-desc {
        color: #c7cdd3;
        line-height: 1.45;
      }
      .insp-impact {
        padding: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.04);
        margin: 8px 0;
        font-family: monospace;
      }
      .insp-sec {
        margin-top: 12px;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .insp-list {
        list-style: none;
        padding: 0;
        margin: 6px 0;
        font-family: monospace;
        font-size: 11px;
      }
      .insp-list li {
        padding: 3px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .badge {
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 10px;
        background: #262b32;
        color: var(--text);
      }
      .pos {
        color: var(--pos);
      }
      .neg {
        color: var(--neg);
      }
      .gold {
        color: var(--gold);
      }
      .cyan {
        color: var(--cyan);
      }
      .muted {
        color: var(--muted);
      }
      .neg-bg {
        background: rgba(207, 106, 106, 0.22);
        color: #ff9c9c;
      }
      .gold-bg {
        background: rgba(216, 184, 118, 0.2);
        color: var(--gold);
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-family: monospace;
        font-size: 12px;
      }
      .data-table th,
      .data-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .data-table th {
        color: var(--muted);
        font-weight: 600;
      }
      .scen-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .scen-card {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 6px;
      }
      .scen-head {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .scen-btc {
        font-family: monospace;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .scen-cond {
        color: var(--muted);
        font-size: 11px;
      }
      .controls-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        align-items: center;
      }
      input,
      select {
        background: #0d0f11;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 4px;
        font-family: monospace;
      }
      .news-item {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 8px;
      }
      .news-meta {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .news-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .news-nodes {
        font-family: monospace;
        font-size: 11px;
        color: var(--cyan);
      }
      .poly-strip {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .poly-pill {
        background: #141920;
        border: 1px solid #2b3847;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 11px;
        display: flex;
        gap: 8px;
      }
      .calib-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 12px;
      }
      .c-card {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .c-card b {
        font-size: 20px;
        color: var(--gold);
        font-family: monospace;
      }
      footer {
        padding: 5px 16px;
        background: #0d0f11;
        border-top: 1px solid var(--border);
        font-family: monospace;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        🕸️ MALCRYPTO × ALADDIN
        <span class="muted" style="font-weight: 400">CAUSAL RISK TERMINAL</span>
      </div>
      <div id="header-kpis" class="kpis"></div>
    </header>

    <div class="nav-bar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="GRAPH">
          🕸️ GRAPH &lt;GO&gt; [F1]
        </button>
        <button class="tab-btn" data-tab="RADAR">
          🎯 RADAR &lt;GO&gt; [F2]
        </button>
        <button class="tab-btn" data-tab="CAUSAL">
          🔬 CAUSAL &lt;GO&gt; [F3]
        </button>
        <button class="tab-btn" data-tab="WIRE">📰 WIRE &lt;GO&gt; [F4]</button>
        <button class="tab-btn" data-tab="CASCADE">
          ⚡ CASCADE &lt;GO&gt; [F5]
        </button>
        <button class="tab-btn" data-tab="CALIB">
          📊 CALIB &lt;GO&gt; [F6]
        </button>
        <button class="tab-btn" data-tab="BACKTEST">
          ⏪ BACKTEST &lt;GO&gt; [F7]
        </button>
      </div>
      <div>
        <button id="btn-refresh" class="btn-primary">⟳ Sync Live Feeds</button>
      </div>
    </div>

    <main>
      <section id="panel-GRAPH" class="tab-panel">
        <canvas id="graph-canvas"></canvas>
        <aside id="node-inspector" class="inspector"></aside>
      </section>

      <section id="panel-RADAR" class="tab-panel hidden">
        <div id="radar-content"></div>
      </section>

      <section id="panel-CAUSAL" class="tab-panel hidden">
        <h3>
          Online Lead-Lag &amp; Granger Causality Discovery (15m Klines + FDR
          Filter)
        </h3>
        <div id="causal-content"></div>
      </section>

      <section id="panel-WIRE" class="tab-panel hidden">
        <div class="controls-row">
          <input
            id="custom-news-input"
            type="text"
            style="flex: 1; min-width: 280px"
            placeholder="Paste headline (e.g. 'Jensen Huang warns on NVIDIA AI GPU slowdown')"
          />
          <input
            id="custom-news-prior"
            type="number"
            step="0.05"
            min="0"
            max="1"
            value="0.75"
            style="width: 90px"
            title="Market Prior Positive Prob (0..1)"
          />
          <button id="btn-parse-news" class="btn-primary">
            Analyze &amp; Propagate
          </button>
        </div>
        <div id="wire-content"></div>
      </section>

      <section id="panel-CASCADE" class="tab-panel hidden">
        <div class="controls-row">
          <select id="sim-trigger">
            <option value="ACTOR_HUANG">Jensen Huang (ACTOR_HUANG)</option>
            <option value="EQ_NVDA">NVIDIA (EQ_NVDA)</option>
            <option value="ACTOR_POWELL">
              Jerome Powell / Fed (ACTOR_POWELL)
            </option>
            <option value="ACTOR_SEC">US SEC / CFTC (ACTOR_SEC)</option>
            <option value="INFRA_USDT">Tether USDT (INFRA_USDT)</option>
            <option value="CRYPTO_BTC">Bitcoin BTC (CRYPTO_BTC)</option>
          </select>
          <input
            id="sim-shock"
            type="number"
            step="0.5"
            value="-9.5"
            style="width: 90px"
          />
          <select id="sim-regime">
            <option value="STRESS_CORRELATION_ONE">
              STRESS_CORRELATION_ONE
            </option>
            <option value="EUPHORIA_OVERLEVERAGED">
              EUPHORIA_OVERLEVERAGED
            </option>
            <option value="RISK_ON_CALM">RISK_ON_CALM</option>
          </select>
          <button id="btn-run-sim" class="btn-primary">Run Stress Test</button>
          <input
            id="tg-token"
            type="password"
            placeholder="Telegram Bot Token"
            style="width: 150px"
          />
          <input
            id="tg-chat"
            type="text"
            placeholder="Chat ID"
            style="width: 100px"
          />
          <button id="btn-send-tg" class="btn-sec">Send TG Alert</button>
        </div>
        <div id="cascade-content"></div>
      </section>

      <section id="panel-CALIB" class="tab-panel hidden">
        <div class="controls-row">
          <button id="btn-prune" class="btn-sec">Prune Weak Hypotheses</button>
          <button id="btn-export-snap" class="btn-sec">
            Export Graph Snapshot (JSON)
          </button>
        </div>
        <div id="calib-content"></div>
      </section>

      <section id="panel-BACKTEST" class="tab-panel hidden">
        <h3>Bi-Temporal Historical Shock Replay (Zero Look-Ahead Bias)</h3>
        <div id="backtest-content"></div>
      </section>
    </main>

    <footer id="status-line">Initializing MalCrypto Aladdin...</footer>
    <script type="module" src="./dist/web.js"></script>
  </body>
</html>
